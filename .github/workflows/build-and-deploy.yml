name: Build & Deploy Verified Tools

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tools-manifest.json'
      - '.github/workflows/build-and-deploy.yml'
      - 'netlify.toml'
  workflow_dispatch:

env:
  NODE_VERSION: '24'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          npm install -g pnpm
          sudo apt-get update -qq
          sudo apt-get install -y unzip
      - name: Build six direct static applications
        run: |
          set -euxo pipefail
          mkdir -p .build-cache tools

          # 1. IT-Tools — pinned tag; Vite output mounted below /tools/it-tools/.
          git clone --depth 1 --branch v2024.10.22-7ca5933 https://github.com/CorentinTh/it-tools.git .build-cache/it-tools
          (
            cd .build-cache/it-tools
            pnpm install --no-frozen-lockfile
            sed -i 's/vite build/vite build --base=\/tools\/it-tools\//g' package.json
            pnpm run build
            mkdir -p ../../tools/it-tools
            cp -r dist/. ../../tools/it-tools/
          )

          # 2. BentoPDF — pinned v2.8.8 build with its native BASE_URL support.
          git clone --depth 1 --branch v2.8.8 https://github.com/alam00000/bentopdf.git .build-cache/bentopdf
          (
            cd .build-cache/bentopdf
            # BentoPDF depends on install-time build hooks (including esbuild and OCR tooling).
            # npm runs those hooks on the Linux CI runner; pnpm 10 blocks them by default.
            npm install --legacy-peer-deps
            BASE_URL=/tools/bentopdf npm run build
            mkdir -p ../../tools/bentopdf
            cp -r dist/. ../../tools/bentopdf/
          )

          # 3. Squoosh — immutable upstream commit with static-path adapter.
          git clone https://github.com/GoogleChromeLabs/squoosh.git .build-cache/squoosh
          (
            cd .build-cache/squoosh
            git checkout e8d35e0fb66eb16eff6fe8fc773eabcbb7128de3
            # Upstream emits root-relative assets. Patch its URL helper at build time so
            # output is isolated under /tools/squoosh/ without modifying the pinned source.
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/entry-data-plugin.js')
          s = p.read_text()
          old = "return fileName.replace(/^static\\//, '/');"
          new = "return fileName.replace(/^static\\//, (process.env.BASE_URL || '/').replace(/\\/?$/, '/'));"
          if old not in s:
              raise SystemExit('Squoosh URL helper signature changed')
          p.write_text(s.replace(old, new, 1))
          p = Path('src/static-build/index.tsx')
          s = p.read_text()
          s = s.replace("start_url: '/?utm_medium", "start_url: '/tools/squoosh/?utm_medium", 1)
          s = s.replace("action: '/?utm_medium", "action: '/tools/squoosh/?utm_medium", 1)
          p.write_text(s)
          PY
            npm install
            BASE_URL=/tools/squoosh/ npm run build
            mkdir -p ../../tools/squoosh
            cp -r build/. ../../tools/squoosh/
          )

          # 4. FreeCut — immutable source commit with dedicated subpath/PWA adapter.
          git clone https://github.com/walterlow/freecut.git .build-cache/freecut
          (
            cd .build-cache/freecut
            git checkout 4d62e8082c5eb387a96275bcbd323d28f6e41a62
            npm ci || npm install
            node ../../scripts/adapt-freecut.mjs
            npm run build
            mkdir -p ../../tools/freecut
            cp -r dist/. ../../tools/freecut/
          )

          # 5. Omniclip — immutable v1.1.3 source commit and Turtle import-map adapter.
          git clone https://github.com/omni-media/omniclip.git .build-cache/omniclip
          (
            cd .build-cache/omniclip
            git checkout cbe581a4a788d9982ffd4a10025c678f9e8707d6
            # The upstream v1.1.3 lock omits cross-platform optional package metadata.
            # Repair only the temporary checkout's lock graph, then install from that lock.
            npm install --package-lock-only --ignore-scripts
            npm ci
            node ../../scripts/adapt-omniclip.mjs pre
            npm run build-netlify
            node ../../scripts/adapt-omniclip.mjs post
            mkdir -p ../../tools/omniclip
            cp -r x/. ../../tools/omniclip/
          )

          # 6. CyberChef — official, pinned v11.3.0 release artifact.
          mkdir -p .build-cache/cyberchef-release tools/cyberchef
          curl -fsSL https://github.com/gchq/CyberChef/releases/download/v11.3.0/CyberChef_d24ba1afce2e3a080308b5df7db033332fe94a1a.zip -o .build-cache/cyberchef.zip
          unzip -q .build-cache/cyberchef.zip -d .build-cache/cyberchef-release
          CYBER_HTML="$(find .build-cache/cyberchef-release -type f -name '*.html' | head -n 1)"
          test -n "$CYBER_HTML"
          CYBER_DIR="$(dirname "$CYBER_HTML")"
          cp -r "$CYBER_DIR"/. tools/cyberchef/
          if [ "$(basename "$CYBER_HTML")" != "index.html" ]; then cp "$CYBER_HTML" tools/cyberchef/index.html; fi

          # 3. miniPaint — package output plus the static HTML, styles and image tree it references.
          git clone --depth 1 --branch v4.14.3 https://github.com/viliusle/miniPaint.git .build-cache/minipaint
          (
            cd .build-cache/minipaint
            npm ci || npm install
            npm run build
            mkdir -p ../../tools/minipaint/src
            cp index.html ../../tools/minipaint/
            cp -r dist images src/css ../../tools/minipaint/src/../ 2>/dev/null || true
            # Keep the source-relative CSS path expected by the upstream HTML.
            mkdir -p ../../tools/minipaint/src
            cp -r src/css ../../tools/minipaint/src/
          )

          # 4. JupyterLite — pinned Python distribution and a static Pyodide notebook site.
          python -m pip install --disable-pip-version-check 'jupyterlite==0.8.2' 'jupyterlite-pyodide-kernel==0.8.3'
          mkdir -p .build-cache/jupyterlite-content
          jupyter lite build --output-dir tools/jupyterlite --contents .build-cache/jupyterlite-content --base-url /tools/jupyterlite/

          # 5. Decimen — immutable source commit; Vite base path set for its tool route.
          git clone https://github.com/aryanjsx/Decimen.git .build-cache/decimen
          (
            cd .build-cache/decimen
            git checkout 435272313f9d477ccb765d4d372acd0102f49363
            npm ci || npm install
            sed -i 's/vite build/vite build --base=\/tools\/decimen\//g' package.json
            npm run build
            mkdir -p ../../tools/decimen
            cp -r dist/. ../../tools/decimen/
          )

          # 6. Bolo — immutable source commit; upstream is a standalone HTML application.
          git clone https://github.com/NakliTechie/bolo.git .build-cache/bolo
          git -C .build-cache/bolo checkout 59661860639da3eb388d5bd6813e8fdd47ad31be
          mkdir -p tools/bolo
          cp .build-cache/bolo/index.html tools/bolo/index.html

      - name: Validate deployment artifacts
        run: |
          set -euxo pipefail
          for tool in it-tools bentopdf squoosh freecut omniclip cyberchef minipaint jupyterlite decimen bolo; do
            test -f "tools/$tool/index.html"
          done
          grep -q '/tools/it-tools/' tools/it-tools/index.html
          grep -q '/tools/bentopdf/' tools/bentopdf/index.html
          grep -q '/tools/squoosh/' tools/squoosh/index.html
          grep -q '/tools/freecut/' tools/freecut/index.html
          test -f tools/freecut/sw.js
          grep -q '/tools/omniclip/vendor/' tools/omniclip/importmap.json
          test -f tools/omniclip/vendor/@benev/slate/x/index.js
          test -f tools/omniclip/coi-serviceworker.js
          grep -q '/tools/decimen/' tools/decimen/index.html
          test -f tools/cyberchef/assets/main.js
          test -f tools/minipaint/dist/bundle.js

      - name: Deploy only a complete validated batch
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: '.'
          production-deploy: true
          deploy-message: 'Validated direct static tools: ${{ github.sha }}'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
