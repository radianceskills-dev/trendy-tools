name: Build & Deploy Verified Tools

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'ai-capabilities.json'
      - 'tools-manifest.json'
      - '.github/workflows/build-and-deploy.yml'
      - 'netlify.toml'
      - 'integrations/**'
      - 'scripts/**'
  workflow_dispatch:

env:
  NODE_VERSION: '24'

jobs:
  build-tool:
    name: Build ${{ matrix.tool }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        tool:
          - it-tools
          - bentopdf
          - squoosh
          - freecut
          - omniclip
          - d2-playground
          - cyberchef
          - minipaint
          - jupyterlite
          - decimen
          - bolo
          - excalidraw
          - openqr
          - keeweb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Use Node.js 22 for Excalidraw
        if: matrix.tool == 'excalidraw'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          npm install -g pnpm
          sudo apt-get update -qq
          sudo apt-get install -y unzip

      # The key is commit-specific so a changed tool can replace its previous
      # output. The restore prefix lets unchanged tools reuse the last build.
      - name: Restore previous tool output
        id: tool-cache
        uses: actions/cache/restore@v4
        with:
          path: tools/${{ matrix.tool }}
          key: tool-output-${{ matrix.tool }}-${{ github.sha }}
          restore-keys: |
            tool-output-${{ matrix.tool }}-

      - name: Build tool when changed or not cached
        id: build
        shell: bash
        env:
          TOOL: ${{ matrix.tool }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          tool_dir="tools/$TOOL"
          should_build=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$BEFORE_SHA" =~ ^0+$ || ! -f "$tool_dir/index.html" ]]; then
            should_build=true
          elif bash scripts/should-build-tool.sh "$TOOL" "$BEFORE_SHA" "$CURRENT_SHA"; then
            should_build=true
          fi

          if [[ "$should_build" == true ]]; then
            rm -rf "$tool_dir"
            bash scripts/build-tool.sh "$TOOL"
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "Using cached $TOOL output"
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

          test -f "$tool_dir/index.html"

      - name: Save rebuilt tool output
        if: steps.build.outputs.built == 'true'
        uses: actions/cache/save@v4
        with:
          path: tools/${{ matrix.tool }}
          key: tool-output-${{ matrix.tool }}-${{ github.sha }}

      - name: Upload tool output
        uses: actions/upload-artifact@v4
        with:
          name: tool-${{ matrix.tool }}
          path: tools/${{ matrix.tool }}
          if-no-files-found: error
          retention-days: 7

  assemble-validate-deploy:
    name: Assemble, validate, and deploy
    needs: build-tool
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install browser-test dependencies
        run: |
          mkdir -p .build-cache/browser-tests
          npm install --prefix .build-cache/browser-tests --no-save playwright-core@1.55.0

      - name: Download tool outputs
        uses: actions/download-artifact@v4
        with:
          pattern: tool-*
          path: tools
          merge-multiple: false

      - name: Flatten downloaded tool directories
        shell: bash
        run: |
          set -euo pipefail
          for tool in it-tools bentopdf squoosh freecut omniclip d2-playground cyberchef minipaint jupyterlite decimen bolo excalidraw openqr keeweb; do
            if [[ -d "tools/tool-$tool" ]]; then
              rm -rf "tools/$tool"
              mv "tools/tool-$tool" "tools/$tool"
            fi
          done

      - name: Validate deployment artifacts
        run: bash scripts/validate-build.sh

      - name: Browser-test BentoPDF AI with a mocked provider response
        run: |
          git clone --depth 1 --branch main https://github.com/radianceskills-dev/trendy-bentopdf.git .build-cache/bentopdf
          npm install --prefix .build-cache/bentopdf --legacy-peer-deps --no-audit --no-fund
          cp integrations/bentopdf-ai/browser-test.cjs .build-cache/browser-tests/bentopdf-browser-test.cjs
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          node .build-cache/browser-tests/bentopdf-browser-test.cjs "$PWD" "$CHROME_BIN"

      - name: Browser-test CyberChef AI with a mocked provider response
        run: |
          git clone --depth 1 --branch main https://github.com/radianceskills-dev/trendy-cyberchef.git .build-cache/cyberchef
          cp .build-cache/cyberchef/tests/trendy-ai/browser-test.cjs .build-cache/browser-tests/cyberchef-browser-test.cjs
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          node .build-cache/browser-tests/cyberchef-browser-test.cjs "$PWD/tools/cyberchef" "$CHROME_BIN"

      - name: Deploy only a complete validated batch
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: '.'
          production-deploy: true
          deploy-message: 'Validated direct static tools: ${{ github.sha }}'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
