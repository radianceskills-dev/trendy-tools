name: Build & Deploy Verified Tools

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tools-manifest.json'
      - '.github/workflows/build-and-deploy.yml'
      - 'netlify.toml'
  workflow_dispatch:

env:
  NODE_VERSION: '24'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: npm install -g pnpm
      - name: Build verified static applications
        run: |
          set -euxo pipefail
          mkdir -p .build-cache tools

          # IT-Tools (Vue/Vite): built with an explicit subdirectory base path.
          git clone --depth 1 --branch v2024.10.22-7ca5933 https://github.com/CorentinTh/it-tools.git .build-cache/it-tools
          cd .build-cache/it-tools
          pnpm install --no-frozen-lockfile
          sed -i 's/vite build/vite build --base=\/tools\/it-tools\//g' package.json
          pnpm run build
          mkdir -p ../../tools/it-tools
          cp -r dist/. ../../tools/it-tools/
          cd ../..

          # CyberChef: static upstream bundle; no server-side component.
          mkdir -p tools/cyberchef/assets tools/cyberchef/images
          curl -fsSL https://gchq.github.io/CyberChef/ -o tools/cyberchef/index.html
          curl -fsSL https://gchq.github.io/CyberChef/assets/main.js -o tools/cyberchef/assets/main.js
          curl -fsSL https://gchq.github.io/CyberChef/assets/main.css -o tools/cyberchef/assets/main.css
          curl -fsSL https://gchq.github.io/CyberChef/assets/aecc661b69309290f600.ico -o tools/cyberchef/assets/aecc661b69309290f600.ico
          for f in cyberchef-128x128.png cook_male-32x32.png fork_me.png; do curl -fsSL "https://gchq.github.io/CyberChef/images/$f" -o "tools/cyberchef/images/$f"; done

          # JupyterLite: static WebAssembly distribution under its own base URL.
          python -m pip install --disable-pip-version-check jupyterlite-core jupyterlite-pyodide-kernel
          mkdir -p .build-cache/jupyterlite-content
          jupyter lite build --output-dir tools/jupyterlite --contents .build-cache/jupyterlite-content --base-url /tools/jupyterlite/

          # Decimen (Vite): explicit subdirectory base path.
          git clone --depth 1 https://github.com/aryanjsx/Decimen.git .build-cache/decimen
          cd .build-cache/decimen
          npm ci || npm install
          sed -i 's/vite build/vite build --base=\/tools\/decimen\//g' package.json
          npm run build
          mkdir -p ../../tools/decimen
          cp -r dist/. ../../tools/decimen/
          cd ../..

          # Bolo: standalone static HTML application.
          git clone --depth 1 https://github.com/NakliTechie/bolo.git .build-cache/bolo
          mkdir -p tools/bolo
          cp .build-cache/bolo/index.html tools/bolo/index.html

      - name: Deploy
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: '.'
          production-deploy: true
          deploy-message: 'Verified tools deployment: ${{ github.sha }}'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
