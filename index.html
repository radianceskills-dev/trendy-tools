<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trendy Tools</title><meta name="description" content="Version-locked, privacy-first browser tools."><style>
:root{--bg:#0f1117;--card:#1a1d27;--line:#2a2e3d;--text:#e4e6eb;--dim:#9aa0b5;--accent:#7c96ff;--green:#4ade80;--amber:#fbbf24}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px Inter,system-ui,sans-serif}header{padding:28px max(20px,calc((100vw - 1180px)/2));border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:18px;align-items:center}.brand{display:flex;gap:11px;align-items:center}.logo{background:var(--accent);font-weight:800;padding:8px;border-radius:9px}.brand h1{font-size:20px;margin:0}.sub{color:var(--dim);font-size:13px}.wrap{max-width:1180px;margin:auto;padding:26px 20px 44px}.notice{border:1px solid #4a3b1b;background:#241e11;color:#f8df9a;padding:13px 15px;border-radius:10px;margin-bottom:22px;font-size:14px}.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}.tool{min-height:190px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:17px;display:flex;flex-direction:column;gap:10px}.tool h2{font-size:16px;margin:0}.tool p{color:var(--dim);font-size:13px;line-height:1.5;margin:0;flex:1}.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--dim)}.badge{padding:4px 8px;border-radius:999px;font-weight:600}.live{background:#123522;color:var(--green)}.pending{background:#382b12;color:var(--amber)}a.open{display:block;text-align:center;background:var(--accent);color:#fff;text-decoration:none;border-radius:8px;padding:8px;font-weight:650}.disabled{display:block;text-align:center;border:1px solid #4b4122;color:#f8df9a;border-radius:8px;padding:8px;font-weight:650}@media(max-width:650px){header{align-items:flex-start;flex-direction:column}}
</style></head><body><header><div class="brand"><div class="logo">TT</div><h1>Trendy Tools</h1></div><div class="sub">Privacy-first · Browser-only · Version-locked</div></header><main class="wrap"><div class="notice"><strong>Verified availability:</strong> only tools that have passed a self-hosted deployment check are enabled. Tools still undergoing compatibility work are intentionally disabled rather than sending customers to a broken page.</div><section class="tools" id="tools"></section></main><script>
const tools=[
['BentoPDF','PDF / Documents','PDF merge, split, OCR, redaction, signing, encryption and compression.','v2.8.8',true,'bentopdf'],
['IT-Tools','Developer Utilities','JSON, JWT, regex, UUID, hashing, timestamp and developer utilities.','v2024.10.22',true,'it-tools'],
['CyberChef','Data / Crypto / Encoding','Data transformation, encoding, encryption, compression and analysis.','v11.3.0',true,'cyberchef'],
['Squoosh','Image Optimization','Browser-based image compression and conversion.','e8d35e0',true,'squoosh'],
['miniPaint','Image Editing','Layered browser image editor with filters and effects.','v4.14.3',true,'minipaint'],
['FreeCut','Video Editing','Browser-native multi-track video editor.','4d62e808',true,'freecut'],
['Omniclip','Video Editing','Open-source browser-local video editor.','v1.1.3',true,'omniclip'],
['Excalidraw','Whiteboarding / Diagrams','Local-first whiteboarding and diagramming.','v0.18.1',true,'excalidraw'],
['D2 Playground','Diagram-as-Code','Technical diagrams generated from plain text.','2a6cf2d',true,'d2-playground'],
['JupyterLite','Coding / Python / Notebooks','Jupyter notebooks and Python in the browser.','v0.8.2',true,'jupyterlite'],
['DuckDB-Wasm','Data Analysis / SQL','Local CSV, JSON and Parquet analysis with SQL.','v1.33.0',false,'duckdb-wasm'],
['OpenQR','QR Utilities','QR generation for URLs, Wi-Fi, contacts and more.','v1.0.0',false,'openqr'],
['Decimen','QR File Transfer','Air-gapped transfer through animated QR codes.','commit-pinned',true,'decimen'],
['KeeWeb','Password Vault','Browser-accessible local KeePass / KDBX vault.','v1.18.7',false,'keeweb'],
['WebLLM','Local AI','Local browser LLM inference through WebGPU.','v0.2.83',false,'web-llm'],
['Bolo','Screen Recording / Transcription','Browser-native screen recording and local transcription.','commit-pinned',true,'bolo']
];
document.querySelector('#tools').innerHTML=tools.map(([n,c,d,v,live,id])=>`<article class="tool"><div class="meta"><span>${c}</span><span class="badge ${live?'live':'pending'}">${live?'Live':'In validation'}</span></div><h2>${n}</h2><p>${d}</p><div class="meta"><code>${v}</code></div>${live?`<a class="open" href="/tools/${id}/">Open tool</a>`:'<span class="disabled">Unavailable while self-hosting is validated</span>'}</article>`).join('');
</script></body></html>
