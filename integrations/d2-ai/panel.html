<section id="ai-create-panel" aria-labelledby="ai-create-title">
  <div class="ai-create-head">
    <div class="ai-create-title" id="ai-create-title"><span class="ai-create-spark" aria-hidden="true">✦</span>Create with AI</div>
    <span class="ai-create-provider" id="ai-create-provider" data-ready="false">Not configured</span>
  </div>
  <textarea id="ai-create-prompt" maxlength="4000" placeholder="Describe a process, architecture, data model, or sequence…" aria-describedby="ai-create-status"></textarea>
  <div class="ai-create-status-row">
    <span id="ai-create-status" role="status" aria-live="polite">Configure AI on the dashboard first.</span>
    <div class="ai-create-actions">
      <a class="ai-create-setup" href="/" target="_blank" rel="noopener">AI setup</a>
      <button id="ai-create-generate" type="button" disabled>Create diagram</button>
    </div>
  </div>
</section>
