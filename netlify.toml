# Netlify configuration for Trendy Tools
# Static site -- no build command on Netlify side.
# Build tools via GitHub Actions, then deploy.

[build]
  publish = "."
  command = "echo 'Static site -- no Netlify build needed.'"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(self)"

# Tool routes are revalidated during active integration work. Do not mark
# un-hashed URLs immutable: a previously missing WASM/JS request could otherwise
# cache an HTML fallback for one year and survive a corrected deployment.
[[headers]]
  for = "/tools/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# Don't cache HTML pages or service worker scripts anywhere
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/tools/*/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/tools/*/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/tools/*/*sw*.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/tools/*/*service-worker*.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# Content-hashed static assets are safe to cache immutably
[[headers]]
  for = "/tools/*/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA routing for tools that need it
[[redirects]]
  from = "/tools/excalidraw/*"
  to = "/tools/excalidraw/index.html"
  status = 200

[[redirects]]
  from = "/tools/it-tools/*"
  to = "/tools/it-tools/index.html"
  status = 200

# FreeCut requires cross-origin isolation for WebAssembly threads and browser media features.
[[headers]]
  for = "/tools/freecut/*"
  [headers.values]
    Cross-Origin-Embedder-Policy = "require-corp"
    Cross-Origin-Opener-Policy = "same-origin"

[[redirects]]
  from = "/tools/freecut/*"
  to = "/tools/freecut/index.html"
  status = 200

# Omniclip uses WebCodecs/FFmpeg workers and requires cross-origin isolation.
[[headers]]
  for = "/tools/omniclip/*"
  [headers.values]
    Cross-Origin-Embedder-Policy = "require-corp"
    Cross-Origin-Opener-Policy = "same-origin"

# D2 AI can call only the three preconfigured API providers.
[[headers]]
  for = "/tools/d2-playground/*"
  [headers.values]
    Content-Security-Policy = "connect-src 'self' https://openrouter.ai https://api.b.ai https://opencode.ai"

# BentoPDF AI workflow creation uses the same fixed OpenAI-compatible providers.
[[headers]]
  for = "/tools/bentopdf/*"
  [headers.values]
    Content-Security-Policy = "connect-src 'self' https://openrouter.ai https://api.b.ai https://opencode.ai"
